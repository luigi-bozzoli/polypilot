name: Demo

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/demo.yml"]
  pull_request:
    paths: ["dashboard/**", ".github/workflows/demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
      VITE_REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20" # match the Dockerfile's Node version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - run: node scripts/check-bundle.mjs dist demo
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: dashboard/playwright-report
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/dist

  deploy:
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
