name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: orchestrator/pom.xml
      # Docker is preinstalled and running on ubuntu-latest, so the Testcontainers IT runs too.
      - run: ./mvnw -B -ntp verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: orchestrator-test-reports
          path: |
            orchestrator/target/surefire-reports
            orchestrator/target/failsafe-reports
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ai-agent, auth-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt
            ${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-bundle.mjs dist prod

  docker-build:
    needs: [orchestrator, python, dashboard]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orchestrator, ai-agent, auth-service, dashboard]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          target: prod
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-smoke:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate a throwaway .env
        run: |
          cp .env.example .env
          for key in JWT_SECRET ENCRYPTION_KEY; do
            sed -i "s|^${key}=.*|${key}=$(openssl rand -base64 32)|" .env
          done
          for key in DB_PASSWORD RABBITMQ_PASSWORD; do
            sed -i "s|^${key}=.*|${key}=$(openssl rand -hex 16)|" .env
          done
          sed -i "s|^DB_USER=.*|DB_USER=polypilot_ci|" .env
          sed -i "s|^RABBITMQ_USER=.*|RABBITMQ_USER=polypilot_ci|" .env
          # Nothing calls Claude during this smoke test — a well-formed dummy key is enough.
          sed -i "s|^ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=sk-ant-ci-smoke-test-dummy|" .env
      - run: docker compose -f docker-compose.prod.yaml --env-file .env up -d --build --wait
      - name: Verify the dashboard serves and proxies to the orchestrator
        run: |
          curl -sf http://localhost:8081/ >/dev/null
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/auth/me)
          test "$status" = "403"
      - name: Verify backend ports stay internal
        run: |
          for port in 8080 8001 8002 5432 6379 5672; do
            if curl -s --max-time 2 "http://localhost:$port/" >/dev/null 2>&1; then
              echo "port $port is reachable from the host — should not be published" >&2
              exit 1
            fi
          done
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yaml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yaml --env-file .env down -v
